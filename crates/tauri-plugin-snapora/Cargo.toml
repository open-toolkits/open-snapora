[package]
name = "tauri-plugin-snapora"
version = "0.1.0"
links = "tauri-plugin-snapora"
authors = ["open-snapora authors"]
description = "Tauri v2 plugin for open-snapora cross-framework screenshot and annotation"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[dependencies]
tauri = { version = "2.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.3"
arboard = "3.4"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
tauri-plugin = { version = "2.0", features = ["build"] }

[profile.dev.package."*"]
opt-level = 3
