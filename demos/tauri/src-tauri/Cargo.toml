[package]
name = "demo-tauri"
version = "0.1.0"
description = "Tauri v2 demo application for open-snapora"
authors = ["open-snapora authors"]
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = ["wry"] }
tauri-plugin-snapora = { path = "../../../crates/tauri-plugin-snapora" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

