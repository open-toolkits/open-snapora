name: Release & Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # 1. 代码校验与所有 NPM 包构建
  build-packages:
    name: Build & Verify Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Publish to NPM (Optional, requires NPM_TOKEN secret)
        if: env.NPM_TOKEN != ''
        run: pnpm run publish:packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 2. 编译 Windows .exe 桌面应用程序
  build-windows-exe:
    name: Build Windows (.exe)
    runs-on: windows-latest
    needs: build-packages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/tauri-plugin-snapora
            demos/tauri/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Build Tauri Windows Executable
        run: pnpm --filter demo-tauri run build:exe

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-tauri-windows-x64
          path: demos/tauri/src-tauri/target/release/demo-tauri.exe

  # 3. 创建 GitHub Release 并附带编译好的二进制文件
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-packages, build-windows-exe]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-tauri-windows-x64
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            release-assets/demo-tauri.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
